name: Labels
on:
  push:
    branches: [main]
    paths: ['.github/labels.yml']
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Create or update labels
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            // Flat "- name: x / color: y / description: z" list; no YAML parser needed.
            const text = fs.readFileSync('.github/labels.yml', 'utf8');
            const labels = text.split(/^- /m).slice(1).map((block) => {
              const get = (k) => (block.match(new RegExp(`^\\s*${k}:\\s*"?(.*?)"?\\s*$`, 'm')) || [])[1];
              return { name: get('name'), color: get('color'), description: get('description') || '' };
            });
            for (const l of labels) {
              try {
                await github.rest.issues.updateLabel({ ...context.repo, ...l });
              } catch (e) {
                if (e.status !== 404) throw e;
                await github.rest.issues.createLabel({ ...context.repo, ...l });
              }
            }
            core.info(`Synced ${labels.length} labels`);
